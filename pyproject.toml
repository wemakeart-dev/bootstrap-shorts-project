[project]
name = "bootstrap-shorts"
version = "0.1.0"
description = "Bootstrap After Effects short-form projects from templates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "typer>=0.15",
]

[project.scripts]
bootstrap-shorts = "bootstrap_shorts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
