name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev --group build

      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check src tests

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev --group build

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build executable
        run: uv run pyinstaller --noconfirm bootstrap-shorts.spec

      - name: Smoke test
        run: dist/bootstrap-shorts.exe --help

      - name: Stage release asset
        shell: pwsh
        run: |
          Copy-Item dist/bootstrap-shorts.exe "dist/bootstrap-shorts-${{ steps.version.outputs.version }}-windows.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: dist/bootstrap-shorts-${{ steps.version.outputs.version }}-windows.exe
          fail_on_unmatched_files: true
          make_latest: true
