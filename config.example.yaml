# Copy this file to config.yaml and fill in machine-specific paths.
# config.yaml is gitignored.

templates:
  main: "E:/path/to/portrait-short-form"
  pre_process: "E:/path/to/portrait-short-form-pre-process"
# Root folder for source clips. Browse stays inside this directory.
raw_footage: "E:/path/to/raw-footage"
projects: "E:/path/to/projects"

# Optional. Leave null to auto-detect the newest AfterFX.exe under Program Files.
after_effects_exe: null

# Filenames used when a templates.* path is a directory.
templates_map:
  main: "portrait-short-form.aep"
  pre_process: "portrait-short-form-pre-process.aep"

project_folders:
  main_import: "01-footage"
  preprocess_import: "footage"
